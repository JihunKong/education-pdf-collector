name: Legacy preflight - retired
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notice:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Explain the replacement without repeating downloads
        run: |
          echo 'This legacy two-URL download probe is retired.'
          echo 'Use Collect official PDF batch with checkpoints, or scripts/collect_batch.py.'
          echo 'This notice does not mean that any PDF was collected.'

name: Collect official PDF batch with checkpoints
on:
  workflow_dispatch:
  push:
    branches: [fix-jeonnam-20260926]
    paths: ['.github/workflows/collect-batch.yml']
permissions:
  contents: read
concurrency:
  group: education-pdf-batch
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Offline regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify existing recipient certificate
        run: |
          actual=$(openssl x509 -in keys/transport_session_cert.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':')
          test "$actual" = D13A89B878A0743CCDD2EE834998FEE337ECE2362236F2F9A55BA4D9A0BCFF60
      - name: Collect selected sources and checkpoint each result
        id: collection
        continue-on-error: true
        run: python3 scripts/collect_batch.py --manifest data/recovery_batch.json --output output --max-items 24 --max-total-mb 200
      - name: Seal original files and audit records
        if: ${{ always() && hashFiles('output/state.json') != '' }}
        run: |
          python3 - <<'PY'
          import subprocess,zipfile,hashlib,tempfile
          from pathlib import Path
          root=Path('output'); files=[p for p in root.rglob('*') if p.is_file()]
          assert files and not any(p.is_symlink() for p in root.rglob('*'))
          assert sum(p.stat().st_size for p in files)<220*1024*1024
          Path('sealed').mkdir(exist_ok=True)
          with tempfile.TemporaryDirectory() as t:
            z=Path(t)/'results.zip'
            with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED) as a:
              for p in files:a.write(p,p.relative_to(root).as_posix())
            subprocess.run(['openssl','cms','-encrypt','-binary','-aes-256-gcm','-in',str(z),'-out','sealed/results.cms','-outform','DER','-recip','keys/transport_session_cert.pem','-keyopt','rsa_padding_mode:oaep','-keyopt','rsa_oaep_md:sha256','-keyopt','rsa_mgf1_md:sha256'],check=True,capture_output=True)
          Path('sealed/results.sha256').write_text(hashlib.sha256(Path('sealed/results.cms').read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() && hashFiles('sealed/results.cms') != '' }}
        with:
          name: sealed-collection-${{ github.run_id }}
          path: sealed/
          retention-days: 3
          if-no-files-found: error
      - name: Report partial batch as incomplete
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('output/run_summary.json')
          if not p.exists():raise SystemExit('No collection summary; not a successful download.')
          r=json.loads(p.read_text());print(json.dumps(r,indent=2))
          raise SystemExit(0 if r['status']=='complete_selected_batch' else 2)
          PY
      - name: Remove temporary plaintext
        if: always()
        run: rm -rf -- output/

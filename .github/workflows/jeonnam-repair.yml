name: Jeonnam transport diagnosis and repair
on:
  workflow_dispatch:
  push:
    branches: [fix-jeonnam-20260926]
    paths: ['.github/workflows/jeonnam-repair.yml']
permissions:
  contents: read
concurrency:
  group: jeonnam-repair
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the existing recipient certificate
        run: |
          actual=$(openssl x509 -in keys/transport_session_cert.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':')
          test "$actual" = D13A89B878A0743CCDD2EE834998FEE337ECE2362236F2F9A55BA4D9A0BCFF60
      - name: Bounded transport tests with verified TLS
        run: |
          python3 - <<'PY'
          import json, subprocess, time
          from pathlib import Path
          out=Path('output'); out.mkdir(exist_ok=True)
          source='https://www.jne.go.kr/open/na/ntt/selectNttInfo.do?mi=551&nttSn=5135663'
          tests=[
            ('jne_default',source,[]),
            ('jne_ipv4',source,['--ipv4']),
            ('jne_tls12',source,['--ipv4','--http1.1','--tlsv1.2','--tls-max','1.2']),
            ('jne_root','https://www.jne.go.kr/main/main.do',['--ipv4']),
            ('jne_robots','https://www.jne.go.kr/robots.txt',['--ipv4']),
          ]
          rows=[]
          for name,url,extra in tests:
            cmd=['curl','--proto','=https','--connect-timeout','12','--max-time','35','--max-filesize','2097152','--silent','--show-error','-D',str(out/(name+'.headers')),'-o',str(out/(name+'.body')),'--write-out','%{json}',*extra,url]
            r=subprocess.run(cmd,capture_output=True,text=True,timeout=40)
            try: d=json.loads(r.stdout)
            except ValueError: d={}
            keys=['http_code','remote_ip','time_namelookup','time_connect','time_appconnect','time_starttransfer','time_total','size_download','content_type','errormsg']
            row={k:d.get(k) for k in keys}; row.update(id=name,url=url,curl_exit=r.returncode,stderr=r.stderr[:500])
            rows.append(row); print(json.dumps(row),flush=True)
            (out/'transport_diagnostics.json').write_text(json.dumps(rows,indent=2),encoding='utf-8')
            time.sleep(2)
          PY
      - name: Encrypt diagnostic responses
        if: always()
        run: python3 -c "from pathlib import Path; from scripts.seal_results import seal; seal(Path('output'),Path('keys/transport_session_cert.pem'),Path('sealed/results.cms'))"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() && hashFiles('sealed/results.cms') != '' }}
        with:
          name: jeonnam-diagnosis-${{ github.run_id }}
          path: sealed/
          retention-days: 3
          if-no-files-found: error
      - name: Remove temporary source responses
        if: always()
        run: rm -rf -- output/
